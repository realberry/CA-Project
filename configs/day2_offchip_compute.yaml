model:
  model_name: mixtral

system:
  gpu_gen: H100
  num_node: 1
  num_device: 4
  processor_type: GPU
  offload:
    collects_gpu_compute: on
    offload_expert_to_cpu_memory: on
    offload_expert_to_ssd: off
    ssd_energy_scale: 1.0
    offload_bandwidth: 4
  distribution:
    expert_tensor_degree: 1
    none_expert_tensor_degree: 4
  optimization:
    compressed_kv: off
    use_absorb: off
    prefill_mode: off
    decode_mode: on

serving:
  max_batch_size: 4
  max_process_token: 0

simulation:
  data: synthesis
  input_len: 1024
  output_len: 8
  precision_byte: 2
  iter: 8
  injection_rate: 0

log:
  output_directory: /home/verso/ca-assignment/Project/SSD-offloading/LLMSimulator/results/day2/raw
