model:
  model_name: mixtral

system:
  gpu_gen: H100
  nvlink_gen: 4
  infiniband_gen: 400
  num_node: 1
  num_device: 4
  processor_type: GPU+LOGIC
  distribution:
    expert_tensor_degree: 1
    none_expert_tensor_degree: 1
  optimization:
    parallel_execution: off
    hetero_subbatch: off
    disagg_system: off
    use_low_unit_moe_only: off
    use_ramulator: off
    compressed_kv: off
    use_absorb: off
    use_flash_mla: off
    use_flash_attention: on
    reuse_kv_cache: on
    kv_cache_reuse_rate: 0.0
    prefill_mode: off
    decode_mode: on

serving:
  max_batch_size: 32
  max_process_token: 0

simulation:
  data: synthesis
  input_len: 2048
  output_len: 10
  precision_byte: 2
  skewness: 0.0
  iter: 5
  injection_rate: 0
  exit_out_of_memory: off
  mem_cap_limit: off

log:
  print_log: on
  export_gantt: off
  output_directory: /home/verso/ca-assignment/Project/day1
  gantt_directory: /home/verso/ca-assignment/Project/day1/gantt
