<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <style>
    text{font-family:Segoe UI,Arial,sans-serif;fill:#17233c}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#667085}.panel{font-size:22px;font-weight:700}.box{font-size:18px;font-weight:650}.note{font-size:14px;fill:#526071}.darktitle{font-size:18px;font-weight:700;fill:#ffffff}.darknote{font-size:15px;fill:#c9d3e8}.arrow{stroke:#667085;stroke-width:4;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#667085"/></marker></defs>
  <rect width="1280" height="720" fill="#f7f8fb"/>
  <text x="54" y="58" class="title">From Duplex reproduction to the off-chip expert experiment</text>
  <text x="54" y="88" class="sub">Mid-evaluation architecture flow · Mixtral top-2 routing · FP16</text>

  <rect x="42" y="125" width="574" height="520" rx="18" fill="#ffffff"/>
  <text x="70" y="168" class="panel">Day 1: Duplex baseline</text>
  <rect x="88" y="218" width="170" height="78" rx="12" fill="#e8f0ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="173" y="251" text-anchor="middle" class="box">Mixtral router</text>
  <text x="173" y="276" text-anchor="middle" class="note">select experts</text>
  <path d="M258 257 L340 257" class="arrow"/>
  <rect x="352" y="194" width="204" height="68" rx="12" fill="#e7f8f5" stroke="#13a89e" stroke-width="2"/>
  <text x="454" y="235" text-anchor="middle" class="box">GPU execution</text>
  <rect x="352" y="286" width="204" height="68" rx="12" fill="#fff0e9" stroke="#ef8354" stroke-width="2"/>
  <text x="454" y="327" text-anchor="middle" class="box">Logic-PIM execution</text>
  <path d="M298 257 L298 320 L340 320" class="arrow"/>
  <rect x="88" y="422" width="468" height="148" rx="12" fill="#f2f4f7"/>
  <text x="112" y="460" class="box">What was demonstrated</text>
  <text x="112" y="494" class="note">• 96 GPU-tagged operations</text>
  <text x="112" y="523" class="note">• 320 Logic-tagged operations</text>
  <text x="112" y="552" class="note">• Analytical and Ramulator-backed runs exited successfully</text>

  <rect x="644" y="125" width="594" height="520" rx="18" fill="#ffffff"/>
  <text x="672" y="168" class="panel">Day 2: off-chip expert path</text>
  <rect x="688" y="218" width="160" height="78" rx="12" fill="#e8f0ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="768" y="251" text-anchor="middle" class="box">Mixtral router</text>
  <text x="768" y="276" text-anchor="middle" class="note">top-2 experts</text>
  <path d="M848 257 L895 257" class="arrow"/>
  <rect x="907" y="208" width="270" height="98" rx="12" fill="#ffe8e8" stroke="#e45756" stroke-width="2"/>
  <text x="1042" y="244" text-anchor="middle" class="box">CPU DRAM</text>
  <text x="1042" y="271" text-anchor="middle" class="note">all expert weights off chip</text>
  <path d="M1042 306 L1042 362" class="arrow"/>
  <text x="1060" y="344" class="note">450 GB/s modeled link</text>
  <rect x="907" y="375" width="270" height="76" rx="12" fill="#fff5dc" stroke="#d9a514" stroke-width="2"/>
  <text x="1042" y="408" text-anchor="middle" class="box">GPU HBM</text>
  <text x="1042" y="433" text-anchor="middle" class="note">stage selected weights</text>
  <path d="M907 413 L848 413" class="arrow"/>
  <rect x="688" y="375" width="160" height="76" rx="12" fill="#e7f8f5" stroke="#13a89e" stroke-width="2"/>
  <text x="768" y="408" text-anchor="middle" class="box">GPU expert</text>
  <text x="768" y="433" text-anchor="middle" class="note">execute after load</text>
  <rect x="688" y="493" width="489" height="77" rx="12" fill="#17233c"/>
  <text x="712" y="526" class="darktitle">Measured memory wall</text>
  <text x="712" y="554" class="darknote">48.774 ms loading vs 7.570 ms execution · 86.6% loading</text>
  <text x="672" y="612" class="note">GPU only · expert tensor degree 1 · non-expert tensor degree 4</text>
</svg>
